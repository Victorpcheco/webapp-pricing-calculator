<div class="auth-page">
  <div class="auth-shell">
    <section class="hero-panel" appSpotlight>
      <div class="hero-content">
        <div class="hero-brand">
          <img class="logo" src="/mp-logo.png" alt="MeuPreço">
          <span>MeuPreço</span>
        </div>

        <h1>Controle absoluto sobre seus lucros.</h1>

        <p>
          A plataforma focada no seu negócio. Gerencie ingredientes,
          calcule o custo real e precifique sem medo de errar.
        </p>
      </div>
    </section>

    <section class="form-panel">
      <div class="auth-card">
        <div class="mobile-brand">
          <img class="logo" src="/mp-logo.png" alt="MeuPreço">
          <span>MeuPreço</span>
        </div>

        <h2>Bem-vindo de volta!</h2>
        <p class="subtitle">Faça login na sua conta para continuar.</p>

        <form [formGroup]="loginForm" (submit)="onSubmit($event)">
          <div class="form-group">
            <label for="email">E-mail</label>
            <div class="field">
              <span class="field-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
              </span>
              <input
                id="email"
                type="email"
                formControlName="email"
                autocomplete="email"
                placeholder="maria@email.com"
              />
            </div>
          </div>

          <div class="form-group last">
            <div class="form-header">
              <label for="password">Senha</label>
              <a routerLink="/esqueci-senha">Esqueceu a senha?</a>
            </div>

            <div class="field">
              <span class="field-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input
                id="password"
                type="password"
                formControlName="password"
                autocomplete="current-password"
                placeholder="••••••••"
              />
            </div>
          </div>

          <button type="submit" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Entrando...' : 'Entrar na Plataforma' }}
          </button>
        </form>

        <p class="auth-link">
          Ainda não tem conta?
          <a routerLink="/cadastro">Cadastre-se</a>
        </p>
      </div>
    </section>
  </div>
</div>
