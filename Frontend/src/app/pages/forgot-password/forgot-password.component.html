<div class="auth-page">
  <section class="hero-section">
    <div class="hero-content">
      <h1>Recupere<br />seu acesso<br />com calma.</h1>

      <p>
        Informe seu e-mail e enviaremos as instruções para redefinir sua senha
        assim que o backend estiver conectado.
      </p>
    </div>
  </section>

  <section class="form-section">
    <div class="auth-card">
      <div class="brand">
        <div class="logo">M</div>
        <span>MeuPreço</span>
      </div>

      <h2>Esqueceu a senha?</h2>
      <p class="subtitle">Digite o e-mail cadastrado para receber as instruções.</p>

      <form (submit)="onSubmit($event)">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="maria@email.com"
          />
        </div>

        <button type="submit">Enviar Instruções</button>
      </form>

      <p class="auth-link">
        Lembrou sua senha?
        <a routerLink="/">Voltar para login</a>
      </p>
    </div>
  </section>
</div>
