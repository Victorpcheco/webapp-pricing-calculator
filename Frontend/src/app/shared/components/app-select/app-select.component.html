<button
  type="button"
  class="app-select-trigger"
  [style.min-height.px]="minHeight"
  [id]="id"
  [attr.aria-label]="ariaLabel"
  [attr.aria-haspopup]="'listbox'"
  [attr.aria-expanded]="open"
  [class.open]="open"
  [class.placeholder]="!value"
  [disabled]="disabled"
  (click)="toggle()"
  (keydown.arrowDown)="$event.preventDefault(); moveActive(1)"
  (keydown.arrowUp)="$event.preventDefault(); moveActive(-1)"
  (keydown.enter)="$event.preventDefault(); confirmActive()"
>
  <span class="app-select-value">{{ selectedLabel }}</span>
  <svg class="app-select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 9 6 6 6-6" />
  </svg>
</button>

@if (open) {
  <ul class="app-select-menu" role="listbox">
    @for (option of options; track option.value; let i = $index) {
      <li
        role="option"
        [attr.aria-selected]="option.value === value"
        [class.selected]="option.value === value"
        [class.active]="i === activeIndex"
        (mouseenter)="activeIndex = i"
        (click)="selectOption(option)"
      >
        {{ option.label }}
      </li>
    }
  </ul>
}
