<button
  type="button"
  class="app-date-trigger"
  [style.min-height.px]="minHeight"
  [id]="id"
  [attr.aria-label]="ariaLabel"
  [attr.aria-haspopup]="'dialog'"
  [attr.aria-expanded]="open"
  [class.open]="open"
  [class.placeholder]="!value"
  [disabled]="disabled"
  (click)="toggle()"
>
  <svg class="app-date-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="16" rx="2" />
    <path d="M3 10h18" />
    <path d="M8 3v4" />
    <path d="M16 3v4" />
  </svg>
  <span class="app-date-value">{{ displayValue || placeholder }}</span>
</button>

@if (open) {
  <div class="app-date-panel" role="dialog" aria-label="Selecionar data">
    <div class="app-date-header">
      <button type="button" class="app-date-nav" aria-label="Mês anterior" (click)="prevMonth()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6" /></svg>
      </button>
      <span class="app-date-month">{{ monthLabel }}</span>
      <button type="button" class="app-date-nav" aria-label="Próximo mês" (click)="nextMonth()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6" /></svg>
      </button>

      @if (weekNavigation) {
        <div class="app-date-week-nav">
          <button type="button" class="app-date-nav small" aria-label="Semana anterior" (click)="prevWeek()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6" /></svg>
          </button>
          <button type="button" class="app-date-nav small" aria-label="Próxima semana" (click)="nextWeek()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
          </button>
        </div>
      }
    </div>

    <div class="app-date-weekdays">
      @for (label of weekdayLabels; track $index) {
        <span>{{ label }}</span>
      }
    </div>

    <div class="app-date-grid">
      @for (cell of days; track cell.iso) {
        <button
          type="button"
          class="app-date-cell"
          [class.muted]="!cell.inMonth"
          [class.today]="cell.isToday"
          [class.selected]="cell.isSelected"
          (click)="selectDay(cell)"
        >
          {{ cell.day }}
          @if (cell.isMarked) {
            <span class="app-date-mark"></span>
          }
        </button>
      }
    </div>

    <div class="app-date-footer">
      <button type="button" class="app-date-link" (click)="clear()">Limpar</button>
      <button type="button" class="app-date-link" (click)="goToday()">Hoje</button>
    </div>
  </div>
}
